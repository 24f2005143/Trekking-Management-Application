{% extends "base.html" %}
{% block title %}Edit Trek{% endblock %}
{% block content %}

<h1 class="mb-3">Edit Trek</h1>

<a class="btn btn-secondary mb-3" href="/admin/treks">Back</a>

<form method="POST" class="mb-4">
    <input class="form-control mb-2" name="trek_name" value="{{ trek.trek_name }}" required>
    <input class="form-control mb-2" name="location" value="{{ trek.location }}" required>

    <select class="form-select mb-2" name="difficulty" required>
        <option value="Easy" {% if trek.difficulty == 'Easy' %}selected{% endif %}>Easy</option>
        <option value="Moderate" {% if trek.difficulty == 'Moderate' %}selected{% endif %}>Moderate</option>
        <option value="Difficult" {% if trek.difficulty == 'Difficult' %}selected{% endif %}>Difficult</option>
    </select>

    <input class="form-control mb-2" type="number" name="duration" value="{{ trek.duration }}" required>

    <button class="btn btn-primary" type="submit">Update Trek</button>
</form>

{% endblock %}
