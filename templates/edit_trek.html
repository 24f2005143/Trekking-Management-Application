{% extends "base.html" %}
{% block title %}Edit Trek{% endblock %}
{% block content %}

<h1 class="mb-3">Edit Trek</h1>

<a class="btn btn-secondary mb-3" href="/admin/treks">Back</a>

<form method="POST" class="mb-4">
    <label class="form-label">Trek Name</label>
    <input class="form-control mb-2" name="trek_name" value="{{ trek.trek_name }}" required>

    <label class="form-label">Location</label>
    <input class="form-control mb-2" name="location" value="{{ trek.location }}" required>

    <label class="form-label">Description</label>
    <textarea class="form-control mb-2" name="description" rows="2">{{ trek.description or '' }}</textarea>

    <label class="form-label">Difficulty</label>
    <select class="form-select mb-2" name="difficulty" required>
        <option value="Easy" {% if trek.difficulty == 'Easy' %}selected{% endif %}>Easy</option>
        <option value="Moderate" {% if trek.difficulty == 'Moderate' %}selected{% endif %}>Moderate</option>
        <option value="Difficult" {% if trek.difficulty == 'Difficult' %}selected{% endif %}>Difficult</option>
    </select>

    <label class="form-label">Duration (days)</label>
    <input class="form-control mb-2" type="number" name="duration" value="{{ trek.duration }}" required>

    <label class="form-label">Available Slots</label>
    <input class="form-control mb-2" type="number" name="available_slots" value="{{ trek.available_slots }}" required>

    <label class="form-label">Status</label>
    <select class="form-select mb-3" name="status">
        <option value="Pending" {% if trek.status == 'Pending' %}selected{% endif %}>Pending</option>
        <option value="Open" {% if trek.status == 'Open' %}selected{% endif %}>Open</option>
        <option value="Closed" {% if trek.status == 'Closed' %}selected{% endif %}>Closed</option>
        <option value="Completed" {% if trek.status == 'Completed' %}selected{% endif %}>Completed</option>
    </select>

    <button class="btn btn-primary" type="submit">Update Trek</button>
</form>

{% endblock %}
