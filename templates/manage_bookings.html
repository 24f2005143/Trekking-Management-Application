{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}

<h1>Bookings</h1>

<a href="/admin">Back</a>

<a href="{{ url_for('admin_bp.booking_history') }}">View Booking History</a>

<table border="1">

<tr>
    <th>ID</th>
    <th>User ID</th>
    <th>Trek ID</th>
    <th>Status</th>
    <th>Action</th>
</tr>

{% for b in bookings %}
<tr>
    <td>{{ b.id }}</td>
    <td>{{ b.user_id }}</td>
    <td>{{ b.trek_id }}</td>
    <td>{{ b.booking_status }}</td>
    <td>
        <form method="POST" action="{{ url_for('admin_bp.cancel_booking', id=b.id) }}">
            <button type="submit">Cancel</button>
        </form>
    </td>
</tr>
{% endfor %}

</table>


{% endblock %}
